services:
  - type: web
    name: kleerinfini-academy
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    envVars:
      - key: VITE_API_URL
        value: "https://kleerinfini-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

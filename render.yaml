# render.yaml — Configuration déploiement complet KleerInfini
# Placer ce fichier à la RACINE du repository (à côté des dossiers kleer-infini-backend et kleerinfini-b2b-platform)

services:
  # ─────────────────────────────────────────
  # 1. BACKEND DJANGO (Web Service)
  # ─────────────────────────────────────────
  - type: web
    name: kleerinfini-backend
    runtime: python
    rootDir: kleer-infini-backend/kleerinfini
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,kleerinfini.dz,www.kleerinfini.dz"
      - key: DATABASE_URL
        sync: false   # À renseigner avec ton lien Supabase dans le dashboard Render
      - key: GIT_LFS_SKIP_SMUDGE
        value: "1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://kleerinfini-frontend.onrender.com,https://kleer-infini.netlify.app,https://kleerinfini.dz,https://www.kleerinfini.dz,http://localhost:5173,http://127.0.0.1:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://kleerinfini-backend.onrender.com,https://kleerinfini-backend-xo0t.onrender.com,https://kleerinfini-frontend.onrender.com,https://kleer-infini.netlify.app,https://kleerinfini.dz,https://www.kleerinfini.dz,http://localhost:5173"
      - key: USE_CLOUDINARY
        value: "True"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false   # À configurer dans le dashboard Render (onglet Environment)
      - key: CLOUDINARY_API_KEY
        sync: false   # À configurer dans le dashboard Render (onglet Environment)
      - key: CLOUDINARY_API_SECRET
        sync: false   # À configurer dans le dashboard Render (onglet Environment)
      - key: EMAIL_HOST_USER
        value: "kleernetinfini@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false   # À configurer dans le dashboard Render (onglet Environment)
      - key: DEFAULT_FROM_EMAIL
        value: "kleernetinfini@gmail.com"
      - key: ADMIN_PASSWORD_1
        sync: false   # À renseigner manuellement (admin@kleerinfini.com)
      - key: ADMIN_PASSWORD_2
        sync: false   # À renseigner manuellement (kleernetinfini@gmail.com)
      - key: ADMIN_PASSWORD_3
        sync: false   # À renseigner manuellement (kleerlogistics@gmail.com)
      - key: ADMIN_PASSWORD_4
        sync: false   # À renseigner manuellement (admin2@kleerinfini.com)

  # ─────────────────────────────────────────
  # 2. FRONTEND REACT (Static Site)
  # ─────────────────────────────────────────
  - type: static
    name: kleerinfini-frontend
    rootDir: kleerinfini-b2b-platform/kleerinfini-ui
    buildCommand: "npm ci --legacy-peer-deps && npm run build"
    staticPublishPath: "dist"
    envVars:
      - key: NODE_VERSION
        value: "20.10.0"
      - key: VITE_API_URL
        value: "https://projet-1.onrender.com"
      - key: GIT_LFS_SKIP_SMUDGE
        value: "1"
    routes:
      # React SPA: all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html


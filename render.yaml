# render.yaml — Configuration déploiement complet KleerInfini
# Placer ce fichier à la RACINE du repository (à côté des dossiers kleer-infini-backend et kleerinfini-b2b-platform)

services:
  # ─────────────────────────────────────────
  # 1. BACKEND DJANGO (Web Service)
  # ─────────────────────────────────────────
  - type: web
    name: kleerinfini-backend
    runtime: python
    rootDir: kleer-infini-backend/kleerinfini
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "kleerinfini-backend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: kleerinfini-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://kleerinfini-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://kleerinfini-frontend.onrender.com"
      - key: USE_CLOUDINARY
        value: "True"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false   # À renseigner manuellement dans Render dashboard
      - key: CLOUDINARY_API_KEY
        sync: false   # À renseigner manuellement dans Render dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false   # À renseigner manuellement dans Render dashboard
      - key: EMAIL_HOST_USER
        value: "kleernetinfini@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false   # À renseigner manuellement dans Render dashboard
      - key: DEFAULT_FROM_EMAIL
        value: "kleernetinfini@gmail.com"
      - key: ADMIN_PASSWORD_1
        sync: false   # À renseigner manuellement (admin@kleerinfini.com)
      - key: ADMIN_PASSWORD_2
        sync: false   # À renseigner manuellement (kleernetinfini@gmail.com)
      - key: ADMIN_PASSWORD_3
        sync: false   # À renseigner manuellement (kleerlogistics@gmail.com)
      - key: ADMIN_PASSWORD_4
        sync: false   # À renseigner manuellement (admin2@kleerinfini.com)

  # ─────────────────────────────────────────
  # 2. FRONTEND REACT (Static Site)
  # ─────────────────────────────────────────
  - type: web
    name: kleerinfini-frontend
    runtime: static
    rootDir: kleerinfini-b2b-platform/kleerinfini-ui
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    envVars:
      - key: NODE_VERSION
        value: "20.10.0"
      - key: VITE_API_URL
        value: "https://kleerinfini-backend.onrender.com"
    routes:
      # React SPA: all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html

# ─────────────────────────────────────────
# 3. BASE DE DONNÉES POSTGRESQL
# ─────────────────────────────────────────
databases:
  - name: kleerinfini-db
    plan: free
    databaseName: kleerinfini
    user: kleerinfini_admin
